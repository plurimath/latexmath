# Based on the Cimas rubygems-release profile used by plurimath/amath, with
# trusted publishing: no RubyGems API key is passed, so
# metanorma/ci's rubygems-release.yml publishes through the RubyGems
# trusted publisher configured for this repository and workflow file.
name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch or pre|rc|etc
        required: true
        default: 'skip'
  repository_dispatch:
    types: [ do-release ]

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: metanorma/ci/.github/workflows/rubygems-release.yml@main
    with:
      next_version: ${{ github.event.inputs.next_version }}
    secrets:
      pat_token: ${{ secrets.PLURIMATH_CI_PAT_TOKEN }}
