# Based on the Cimas rubygems-release profile used by plurimath/amath.
# The RubyGems API key is passed as before, so metanorma/ci's
# rubygems-release.yml publishes through the API-key path. id-token: write
# stays so a trusted publisher can replace the key later.
name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch or pre|rc|etc
        required: true
        default: 'skip'
  repository_dispatch:
    types: [ do-release ]

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: metanorma/ci/.github/workflows/rubygems-release.yml@main
    with:
      next_version: ${{ github.event.inputs.next_version }}
    secrets:
      rubygems-api-key: ${{ secrets.PLURIMATH_CI_RUBYGEMS_API_KEY }}
      pat_token: ${{ secrets.PLURIMATH_CI_PAT_TOKEN }}
