name: test

on:
  push:
    branches: [ main ]
    tags: [ v* ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Parser and model specs on ${{ matrix.os }} ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ['3.2', '3.3', '3.4']

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # The native-engine examples skip where Parsanol's native extension
      # is not available; the parser job below requires it.
      - run: bundle exec rspec spec/parser spec/model spec/standalone

  artifact:
    name: Grammar and artifact regeneration
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # The envelope records the compiler and the Ruby whose Unicode tables
      # it was built with; rebuilding with either changed changes its bytes.
      - name: Use the compiler and Ruby the committed artifact records
        run: |
          echo "PARSANOL_VERSION=$(awk '$1 == "compiler_version" { print $2 }' artifacts/latex.checksums.txt)" >> "$GITHUB_ENV"
          echo "ARTIFACT_RUBY=$(jq -r '.unicode_tables' artifacts/latex.json | sed -n 's/^onigmo (Ruby \(.*\))$/\1/p')" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.ARTIFACT_RUBY }}
          bundler-cache: true

      - name: Regenerate the grammar, compile twice, rewrite the manifest
        run: bundle exec ruby scripts/compile.rb --determinism

      - name: Check the artifact against its source
        run: bundle exec parsanol parg check --source grammars/latex.parg --artifact artifacts/latex.json

      - name: The model classes match the normalized grammar
        run: ruby scripts/generate_model.rb --check

      - name: Export and verify the model's LML documents
        run: bundle exec ruby scripts/verify_lml.rb

      - name: Require the committed files to equal the regenerated ones
        run: git diff --exit-code -- grammars artifacts lib/latexmath/model model

  parser:
    name: Artifact and parser specs on ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
    env:
      # Parsanol ships a precompiled native extension for x86_64 Linux;
      # fail instead of skipping the native-engine examples if it is missing.
      LATEXMATH_REQUIRE_NATIVE: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rspec spec/artifact spec/parser spec/model spec/standalone

  parity:
    name: Raw-tree parity with the pinned Plurimath (sample)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Plurimath commit
        id: pins
        run: |
          echo "commit=$(ruby -ryaml -e 'puts YAML.load_file("scripts/oracle/pins.yml").dig("plurimath", "commit")')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: plurimath/plurimath
          ref: ${{ steps.pins.outputs.commit }}
          path: tmp/oracle-plurimath
          persist-credentials: false

      # oracle.gemfile.lock was resolved with Bundler 4 on Ruby 4.0.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Install the locked oracle bundle
        run: |
          echo "/.latexmath-oracle/" >> tmp/oracle-plurimath/.git/info/exclude
          ruby scripts/oracle/setup.rb --oracle tmp/oracle-plurimath

      - name: The symbol table matches a fresh export from the pinned Plurimath
        run: bundle exec ruby scripts/export_symbols.rb --oracle tmp/oracle-plurimath --check
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/tmp/oracle-plurimath/.latexmath-oracle/Gemfile

      - name: Capture the sample rows from the legacy oracle
        run: >-
          bundle exec ruby scripts/oracle/capture.rb
          --oracle tmp/oracle-plurimath
          --inputs spec/parser/fixtures/oracle-sample.yaml
          --report tmp/oracle-sample.json

      - name: Replay them through the raw-tree boundary on both engines
        run: bundle exec rspec spec/parser/oracle_parity_spec.rb
        env:
          LATEXMATH_ORACLE_REPORT: tmp/oracle-sample.json
          LATEXMATH_REQUIRE_NATIVE: '1'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-sample-report
          path: tmp/oracle-sample.json
          if-no-files-found: warn

  gem:
    name: Gem build and installed gem smoke test on ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.4']

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - run: gem build latexmath.gemspec

      - name: The gem holds only what it needs at run time
        run: |
          gem spec ./latexmath-*.gem files | sed -n 's/^- //p' | sort > "$RUNNER_TEMP/files.txt"
          cat "$RUNNER_TEMP/files.txt"
          unexpected=$(grep -Ev '^(lib/.*\.rb|artifacts/[^/]+|data/latex-symbols\.json|grammars/latex\.wrappers\.json|model/[^/]+|docs/[^/]+\.adoc|README\.adoc|CHANGELOG\.md|LICENSE\.md)$' "$RUNNER_TEMP/files.txt" || true)
          test -z "$unexpected" || { echo "unexpected files: $unexpected"; exit 1; }
          for f in lib/latexmath.rb artifacts/latex.json artifacts/latex.bindings.ruby.json data/latex-symbols.json grammars/latex.wrappers.json LICENSE.md; do
            grep -qx "$f" "$RUNNER_TEMP/files.txt" || { echo "missing $f"; exit 1; }
          done

      - name: Install the built gem alone and parse with it
        run: |
          export GEM_HOME="$RUNNER_TEMP/gems" GEM_PATH="$RUNNER_TEMP/gems"
          gem install --no-document ./latexmath-*.gem
          cd "$RUNNER_TEMP"
          ruby -rlatexmath -e '
            abort "Plurimath is loaded" if defined?(Plurimath)
            abort "the 0.1.x API is still there" if Latexmath.respond_to?(:legacy_parse) || defined?(Latexmath::Tokenizer)
            abort "loaded from the checkout" unless $LOADED_FEATURES.grep(%r{/latexmath/parser\.rb\z}).first.start_with?(ENV["GEM_HOME"])
            r = Latexmath::RawParser.parse("\\frac{1}{2}", engine: :native)
            abort "unexpected tree #{r.tree.inspect}" unless r.tree.key?(:binary)
            d = Latexmath.parse("\\frac{1}{2}", engine: :ruby)
            abort "unexpected model #{d.inspect}" unless d.expression.binary.binary.literal == "frac"
            p Latexmath.parse("x^2")
            puts "ok #{Latexmath::VERSION} #{r.engine} #{d.class} #{Latexmath.artifact_paths.first}"
          '

  oracle-harness:
    name: Oracle harness specs on ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rspec spec/oracle

  oracle-smoke:
    name: Oracle smoke capture against pinned Plurimath
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Plurimath commit
        id: pins
        run: |
          echo "commit=$(ruby -ryaml -e 'puts YAML.load_file("scripts/oracle/pins.yml").dig("plurimath", "commit")')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: plurimath/plurimath
          ref: ${{ steps.pins.outputs.commit }}
          path: tmp/oracle-plurimath

      # oracle.gemfile.lock was resolved with Bundler 4 on Ruby 4.0.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Install the locked oracle bundle
        run: |
          echo "/.latexmath-oracle/" >> tmp/oracle-plurimath/.git/info/exclude
          ruby scripts/oracle/setup.rb --oracle tmp/oracle-plurimath

      - name: Capture the smoke rows
        run: >-
          bundle exec ruby scripts/oracle/capture.rb
          --oracle tmp/oracle-plurimath
          --ids smoke-success,smoke-refusal
          --report tmp/oracle-smoke.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-smoke-report
          path: tmp/oracle-smoke.json
          if-no-files-found: warn
